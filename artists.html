<!DOCTYPE html>
<html>
<head>
    <title>ARTISTS - BLINK PLAYLISTS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: white;
            margin: 0;
        }

        header {
            background-color: lightblue;
            padding: 35px 60px;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: auto;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .logo {
            width: 180px;
            height: 180px;
            object-fit: contain;
        }

        .brand-text h1 {
            font-size: 42px;
            margin: 0;
        }

        .brand-text p {
            font-size: 22px;
            margin: 15px 0 0 0;
        }

        .search-box {
            display: flex;
            gap: 12px;
        }

        .search-box input {
            width: 280px;
            padding: 13px;
            font-size: 16px;
        }

        button {
            background-color: lightpink;
            border: 1px solid gray;
            padding: 10px 20px;
        }

        .search-box button {
            padding: 13px 28px;
        }

        nav {
            background-color: lightpink;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: black;
            text-decoration: none;
            margin: 0 20px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            width: 90%;
            max-width: 1400px;
            margin: 20px auto;
        }

        .box {
            background-color: whitesmoke;
            border: 2px solid lightblue;
            padding: 20px;
        }

        .artist-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .artist {
            background-color: white;
            border: 2px solid lightpink;
            padding: 20px;
            width: calc(50% - 10px);
            text-align: center;
        }

        .artist img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
        }

        footer {
            background-color: lightpink;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<header>
    <div class="header-content">

        <div class="brand">
            <img src="logo.png" class="logo">

            <div class="brand-text">
                <h1>BLINK PLAYLISTS</h1>
                <p>Your Place for Good Music</p>
            </div>
        </div>

        <div class="search-box">
            <input type="text" placeholder="Search songs, artists...">
            <button>Search</button>
        </div>

    </div>
</header>

<nav>
    <a href="home.html">HOME</a>
    <a href="songs.html">SONGS</a>
    <a href="artists.html">ARTISTS</a>
    <a href="playlists.html">PLAYLISTS</a>
    <a href="contact.html">CONTACT</a>
</nav>

<main>

    <div class="box">

        <h2>ARTISTS</h2>

        <div class="artist-container">

            <div class="artist">
                <img src="cristine.jpg" alt="Cristine">
                <h3>CRISTINE</h3>
                <p>Pop Singer</p>
                <button>VIEW PROFILE</button>
            </div>

            <div class="artist">
                <img src="ladyrose.jpg" alt="Lady Rose">
                <h3>LADY ROSE</h3>
                <p>Pop Singer</p>
                <button>VIEW PROFILE</button>
            </div>

            <div class="artist">
                <img src="breanna.jpg" alt="Breanna">
                <h3>BREANNA</h3>
                <p>Pop Singer</p>
                <button>VIEW PROFILE</button>
            </div>

            <div class="artist">
                <img src="jelyka.jpg" alt="Jelyka">
                <h3>JELYKA</h3>
                <p>Pop Singer</p>
                <button>VIEW PROFILE</button>
            </div>

        </div>

    </div>

</main>

<footer>
    <p>© 2026 Blink. All Rights Reserved.</p>
</footer>

</body>
</html>
